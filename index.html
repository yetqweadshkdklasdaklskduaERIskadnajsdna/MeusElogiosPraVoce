<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Um site feito com carinho, cheio de elogios e sentimentos especiais pra você.">
    <title>Meus Elogios Pra Você 💛</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        /* ── Index Page Styles ── */
        body {
            background: #faf7f2;
            color: #3a3028;
            min-height: 100vh;
        }

        /* ── Floating Particles ── */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle linear infinite;
        }

        /* ── Hero Section ── */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            z-index: 1;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(212, 175, 125, 0.12) 0%, transparent 70%),
                        radial-gradient(ellipse at 80% 80%, rgba(180, 140, 180, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-heart {
            font-size: 2.5rem;
            animation: heartbeat 2s ease-in-out infinite;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeIn 1s ease 0.3s forwards, heartbeat 2s ease-in-out 1.3s infinite;
        }

        .hero-title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.8rem, 7vw, 5.5rem);
            color: #5a4a3a;
            line-height: 1.2;
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeInUp 1.2s ease 0.5s forwards;
        }

        .hero-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1rem, 2.5vw, 1.35rem);
            font-weight: 400;
            font-style: italic;
            color: #8a7a6a;
            letter-spacing: 0.5px;
            max-width: 500px;
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeInUp 1.2s ease 0.8s forwards;
        }

        .hero-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c4a882, transparent);
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeIn 1.5s ease 1s forwards;
        }

        /* ── Photo Gallery ── */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 750px;
            width: 100%;
            padding: 0 20px;
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeInUp 1.2s ease 1.2s forwards;
        }

        .gallery-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 1;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 4px 20px rgba(90, 74, 58, 0.1);
        }

        .gallery-item:nth-child(1) {
            grid-row: span 2;
            aspect-ratio: auto;
        }

        .gallery-item:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 40px rgba(90, 74, 58, 0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .gallery-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(90, 74, 58, 0.15) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .gallery-item:hover::after {
            opacity: 1;
        }

        /* ── Navigation Cards ── */
        .nav-cards {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 24px;
            margin-bottom: 80px;
            opacity: 0;
            animation: fadeInUp 1.2s ease 1.5s forwards;
        }

        .nav-card {
            position: relative;
            width: 280px;
            padding: 40px 32px;
            border-radius: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.45s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(196, 168, 130, 0.4), rgba(180, 140, 180, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .nav-card-sentimentos {
            background: linear-gradient(145deg, rgba(180, 140, 180, 0.08), rgba(200, 170, 200, 0.04));
        }

        .nav-card-elogios {
            background: linear-gradient(145deg, rgba(196, 168, 130, 0.1), rgba(220, 190, 150, 0.04));
        }

        .nav-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(90, 74, 58, 0.12);
        }

        .nav-card-icon {
            font-size: 2.2rem;
            margin-bottom: 16px;
            display: block;
            transition: transform 0.4s ease;
        }

        .nav-card:hover .nav-card-icon {
            transform: scale(1.15);
        }

        .nav-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: #5a4a3a;
            margin-bottom: 10px;
        }

        .nav-card-desc {
            font-size: 0.85rem;
            color: #9a8a7a;
            font-weight: 400;
            line-height: 1.5;
        }

        .nav-card-arrow {
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #b49a78;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .nav-card:hover .nav-card-arrow {
            gap: 10px;
            color: #8a6a48;
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: 30px 24px 40px;
            opacity: 0;
            animation: fadeIn 1.5s ease 2s forwards;
        }

        .footer-text {
            font-family: 'Great Vibes', cursive;
            font-size: 1.4rem;
            color: #c4a882;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .gallery-item:nth-child(1) {
                grid-row: span 1;
            }

            .nav-cards {
                gap: 18px;
            }

            .nav-card {
                width: 100%;
                max-width: 320px;
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-heart">💛</div>
        <h1 class="hero-title">Meus Elogios Pra Você</h1>
        <p class="hero-subtitle">Um cantinho feito com todo carinho do mundo, só pra te lembrar o quanto você é especial</p>
        <div class="hero-line"></div>

        <!-- Photo Gallery -->
        <div class="gallery">
            <div class="gallery-item">
                <img src="Fotinhas/Lindeza.jpeg" alt="Foto especial" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="Fotinha2/Fotinha3.jpeg" alt="Foto especial" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="Fotinhas/Lindeza2.jpeg" alt="Foto especial" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="Fotinha2/Fotinha7.jpeg" alt="Foto especial" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="Fotinhas/Fotinha5.jpeg" alt="Foto especial" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="Fotinhas/PaisagemRoçaAmarelinha.jpeg" alt="Paisagem especial" loading="lazy">
            </div>
        </div>

        <!-- Navigation Cards -->
        <div class="nav-cards">
            <a href="MeuSentimentoHEHE.html" class="nav-card nav-card-sentimentos">
                <span class="nav-card-icon">🎬</span>
                <h2 class="nav-card-title">Meus Sentimentos</h2>
                <p class="nav-card-desc">Dois vídeos que dizem o que palavras não conseguem</p>
                <span class="nav-card-arrow">Assistir →</span>
            </a>
            <a href="elogios.html" class="nav-card nav-card-elogios">
                <span class="nav-card-icon">✨</span>
                <h2 class="nav-card-title">100 Elogios</h2>
                <p class="nav-card-desc">Cem motivos pelos quais você é incrível</p>
                <span class="nav-card-arrow">Descobrir →</span>
            </a>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">feito com amor 💛</p>
    </footer>

    <script>
        // ── Create floating particles ──
        const particlesContainer = document.getElementById('particles');
        const colors = ['#d4af7d', '#c4a882', '#b49a78', '#e0c8a8', '#c8b0d0'];

        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 5 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            particle.style.animationDuration = (Math.random() * 4 + 3) + 's';
            particle.style.animationDelay = (Math.random() * 5) + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
